<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anguria & Contadino: Il Fumetto Interattivo</title>
    <style>
        /* Stile Pixel Art */
        body {
            background-color: #2c3e50;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        #game-container {
            width: 600px;
            background-color: #ecf0f1;
            border: 8px solid #34495e;
            padding: 20px;
            color: #2c3e50;
            text-align: center;
            box-shadow: 10px 10px 0px #000;
        }

        .comic-frame {
            border: 4px solid #2c3e50;
            height: 300px;
            background-color: #87CEEB; /* Cielo */
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 10px;
        }

        /* Personaggi in Pixel Art (CSS) */
        .character { position: relative; transition: all 0.5s; }

        .watermelon {
            width: 80px; height: 40px;
            background: #27ae60;
            border-bottom: 8px solid #2ecc71;
            border-radius: 0 0 50px 50px;
            position: relative;
        }
        .watermelon-red {
            width: 70px; height: 30px;
            background: #e74c3c;
            margin: 0 auto;
            border-radius: 0 0 40px 40px;
            position: relative;
        }
        .eye { width: 6px; height: 6px; background: black; position: absolute; top: 5px; }
        .mouth { width: 10px; height: 4px; background: black; position: absolute; top: 15px; left: 30px; }

        .farmer {
            width: 50px; height: 80px;
            background: #f1c40f; /* Vestiti */
            position: relative;
        }
        .hair {
            width: 40px; height: 20px;
            background: #e67e22; /* Ciuffo carota */
            position: absolute; top: -20px; left: 5px;
            border-radius: 10px 10px 0 0;
        }

        .watering-can {
            width: 40px; height: 30px;
            background: #7f8c8d;
            position: absolute;
            top: 20px; right: 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        .buttons { display: flex; justify-content: center; gap: 10px; }
        button {
            padding: 10px;
            background: #2ecc71;
            border: 3px solid #27ae60;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #27ae60; }
        
        #dialogue { height: 50px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <h2 id="title">L'Anguria Magica</h2>
    
    <div class="comic-frame" id="stage">
        <div class="character" id="anguria">
            <div class="watermelon">
                <div class="watermelon-red">
                    <div class="eye" style="left: 15px;"></div>
                    <div class="eye" style="right: 15px;"></div>
                    <div class="mouth" id="mouth"></div>
                </div>
            </div>
        </div>

        <div class="character" id="contadino">
            <div class="hair"></div>
            <div class="farmer"></div>
        </div>

        <div id="can" class="watering-can" onclick="moveCan()"></div>
    </div>

    <div id="dialogue">Ciao! Sono una fetta d'anguria parlante. Vuoi i miei semi per piantarli?</div>

    <div class="buttons">
        <button onclick="pianta(true)">Sì, piantiamoli!</button>
        <button onclick="pianta(false)">No, grazie.</button>
    </div>
</div>

<script>
    const dialogue = document.getElementById('dialogue');
    const anguria = document.getElementById('anguria');
    const can = document.getElementById('can');

    function pianta(scelta) {
        if(scelta) {
            dialogue.innerText = "Il contadino dal ciuffo carota ha piantato i semi! Ora serve acqua...";
            // Crea un piccolo seme a terra
            const seed = document.createElement('div');
            seed.style.cssText = "width:10px; height:10px; background:black; position:absolute; bottom:10px; left:50%; border-radius:50%;";
            document.getElementById('stage').appendChild(seed);
        } else {
            dialogue.innerText = "L'anguria è triste... niente piante oggi.";
            document.getElementById('mouth').style.borderRadius = "50% 50% 0 0";
            document.getElementById('mouth').style.height = "8px";
            document.getElementById('mouth').style.top = "18px";
        }
    }

    function moveCan() {
        can.style.transition = "all 1s";
        can.style.right = "auto";
        can.style.left = "80px";
        can.style.top = "200px";
        dialogue.innerText = "Stai annaffiando l'anguria! Forse diventerà gigante!";
        
        // Effetto crescita
        setTimeout(() => {
            anguria.style.transform = "scale(1.5)";
        }, 1000);
    }
</script>

</body>
</html>
